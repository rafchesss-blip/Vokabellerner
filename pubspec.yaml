name: vokabellerner
description: Vokabeltrainer für jede Sprache mit Spaced Repetition und KI-Scan.
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.0
  flutter_localizations:
    sdk: flutter
  flutter_timezone: ^5.1.1
  image_picker: ^1.2.4
  intl: any
  shared_preferences: ^2.2.3
  timezone: ^0.11.2
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true

  # Datenschutzerklärung pro Sprache (Einstellungen → Datenschutz).
  assets:
    - privacy/
