name: vokabellerner
description: Ein Latein-Vokabeltrainer mit Spaced Repetition – läuft komplett im Browser.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.0
  flutter_timezone: ^5.1.1
  shared_preferences: ^2.2.3
  timezone: ^0.11.2
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Eingebaute Lektionen (eine Textdatei pro Lektion, siehe README).
  assets:
    - lektionen/
