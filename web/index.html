<!DOCTYPE html>
<html lang="de">
<head>
  <!-- Wird beim Bauen durch --base-href ersetzt (GitHub Pages: /<repo>/). -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Latein-Vokabeltrainer mit Karteikarten, Tests und cleverer Wiederholung (Spaced Repetition).">
  <meta name="theme-color" content="#0A0A0F">

  <!-- iOS: als App zum Home-Bildschirm hinzufügen -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Vokabellerner">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Vokabellerner – Latein</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #0A0A0F; }
    @media (prefers-color-scheme: light) {
      html, body { background: #F4F4F7; }
      #loading p { color: #555; }
    }
    #loading {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      transition: opacity .3s;
    }
    #loading img {
      width: 88px; height: 88px; border-radius: 22px;
      animation: pulse 1.4s ease-in-out infinite;
    }
    #loading p { margin: 0; color: #aaa; font-size: 15px; letter-spacing: .02em; }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(.92); opacity: .75; }
    }
  </style>
</head>
<body>
  <div id="loading">
    <img src="icons/Icon-192.png" alt="">
    <p>Vokabellerner lädt …</p>
  </div>
  <script>
    // Ladebildschirm ausblenden, sobald Flutter das erste Bild zeichnet.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (!el) return;
      el.style.opacity = '0';
      setTimeout(function () { el.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
