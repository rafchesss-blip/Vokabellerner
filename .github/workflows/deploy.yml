name: Deploy Web zu Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Flutter einrichten
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Abhängigkeiten laden
        run: flutter pub get

      - name: Web-Version bauen
        run: flutter build web --release

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Funktions-Abhängigkeiten laden
        run: npm install

      - name: Netlify CLI installieren
        run: npm install -g netlify-cli

      - name: Auf Netlify veröffentlichen (inkl. Funktionen)
        run: netlify deploy --prod --dir=build/web --functions=netlify/functions --site "${{ secrets.NETLIFY_SITE_ID }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
